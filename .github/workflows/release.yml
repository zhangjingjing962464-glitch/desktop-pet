name: Release

# 触发：push 形如 v0.1.0 / v1.2.3 的 tag。
# Mac dmg 仍由开发者本地 build（含模型，文件大、版权敏感），通过 gh release 上传；
# 本 workflow 负责 Windows / Linux。
# CI runner 通过 secrets.MODELS_TOKEN 拉私有 repo desktop-pet-models 的 .glb，
# 再打包进 exe / AppImage —— 用户开箱即用，仓库本身不暴露模型。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch models from private repo
        shell: bash
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${MODELS_TOKEN}@github.com/zhangjingjing962464-glitch/desktop-pet-models.git" \
            _models
          mkdir -p assets/models
          cp _models/*.glb assets/models/
          rm -rf _models
          ls assets/models | wc -l

      - run: npm run scripts:manifest

      - name: Build Windows NSIS installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem release | Format-Table -AutoSize

      - name: Upload .exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Fetch models from private repo
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${MODELS_TOKEN}@github.com/zhangjingjing962464-glitch/desktop-pet-models.git" \
            _models
          mkdir -p assets/models
          cp _models/*.glb assets/models/
          rm -rf _models
          ls assets/models | wc -l

      - run: npm run scripts:manifest

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build artifacts
        run: ls -la release/

      - name: Upload .AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
